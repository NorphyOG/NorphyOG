name: Update contribution art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch_contributions.py
      - scripts/render_heatmap_svg.py
      - tests/test_profile_art.py
      - .github/workflows/update-profile-art.yml

permissions:
  contents: read

concurrency:
  group: update-profile-art
  cancel-in-progress: false

jobs:
  heatmap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Test the calendar pipeline
        run: python -m unittest discover -s tests -v
      - name: Fetch verified public contribution data
        run: python scripts/fetch_contributions.py
      - name: Generate the self-contained heatmap
        run: python scripts/render_heatmap_svg.py
      - name: Commit refreshed art
        run: |
          git add -- data/contributions.json assets/contrib-heatmap.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh contribution graph [skip ci]'
          git push
